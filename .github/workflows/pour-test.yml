name: Pour test

# Verifies the end-user experience: a clean runner installing from this tap
# must POUR a prebuilt bottle (seconds, no compiler toolchain) instead of
# building from source. Also exercises the tap-trust gate that newer Homebrew
# enforces for third-party taps.
#
# Runs on pushes to main that touch the formula (e.g. when a bottle PR is
# merged), weekly (to catch host/asset bitrot), and on demand. If the formula
# has no bottle block yet (the window between a version bump and the bottle
# PR), the pour job skips gracefully.
# Supply-chain: actions pinned to full commit SHAs.

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pour:
    name: Bottle pours (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15 # arm64_sequoia
          - macos-26 # arm64_tahoe
          # - macos-15-intel # sequoia (x86_64) — dropped with the Intel bottles for v0.4.7 (see bottle.yml)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # 2026-06-05
        with:
          stable: true # latest stable brew tag, not dev-main (auto = dev-main for a tap repo)

      - name: Install and assert a poured bottle
        run: |
          if ! grep -q "bottle do" Formula/ridincligun.rb; then
            echo "::notice::Formula has no bottle block yet - skipping pour test."
            exit 0
          fi

          brew tap inference-garden/ridincligun
          tap_formula="$(brew --repository inference-garden/ridincligun)/Formula/ridincligun.rb"
          if ! cmp -s "$GITHUB_WORKSPACE/Formula/ridincligun.rb" "$tap_formula"; then
            cp "$GITHUB_WORKSPACE/Formula/ridincligun.rb" "$tap_formula"
          fi

          # Snapshot the compiler-toolchain state before the install so a
          # preinstalled rust/llvm on the runner image cannot mask a failure.
          toolchain_before="$(brew list --versions rust llvm 2>/dev/null || true)"

          start="$(date +%s)"
          brew install inference-garden/ridincligun/ridincligun 2>&1 | tee install.log
          duration="$(( $(date +%s) - start ))"
          echo "Install took ${duration}s"

          # 1. It must have poured, not built. The poured filename uses a
          # single dash and carries the rebuild number
          # (Pouring ridincligun-0.4.5.<tag>.bottle.1.tar.gz), so match
          # loosely rather than assuming the exact shape.
          if ! grep -q "Pouring ridincligun" install.log; then
            echo "Install did not pour a bottle" >&2
            exit 1
          fi
          if grep -q "Building from source" install.log; then
            echo "Install fell back to a source build" >&2
            exit 1
          fi

          # 2. No compiler toolchain may have been pulled in
          toolchain_after="$(brew list --versions rust llvm 2>/dev/null || true)"
          if [ "$toolchain_before" != "$toolchain_after" ]; then
            echo "Install changed the rust/llvm toolchain state:" >&2
            echo "before: ${toolchain_before:-<none>}" >&2
            echo "after:  ${toolchain_after:-<none>}" >&2
            exit 1
          fi

          # 3. The result must work
          brew test inference-garden/ridincligun/ridincligun
          ridincligun --version

  trust-gate:
    name: Tap trust (HOMEBREW_REQUIRE_TAP_TRUST=1)
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # 2026-06-05
        with:
          stable: true # latest stable brew tag, not dev-main (auto = dev-main for a tap repo)

      - name: Untrusted tap is refused, trusted tap loads
        run: |
          brew --version
          # Tap trust ships with newer Homebrew; on versions without it the
          # gate cannot be exercised - skip with a visible notice instead of
          # failing the run for a feature that does not exist yet.
          if ! brew trust --help >/dev/null 2>&1; then
            echo "::notice::This Homebrew has no 'brew trust' command - tap-trust enforcement not shipped yet; skipping the gate test. Re-check when Homebrew 6 lands."
            exit 0
          fi

          brew tap inference-garden/ridincligun

          # Clean slate for the round-trip check.
          brew untrust inference-garden/ridincligun >/dev/null 2>&1 || true

          # What enforcement actually refuses is brew-version-dependent: a
          # read-only `brew info` on a fully-qualified formula warns but does
          # NOT exit non-zero on an untrusted tap (observed on brew 6.0.1).
          # So log the untrusted behavior rather than asserting a fragile
          # exit code, and hard-assert only the stable, user-facing facts:
          # the trust commands work, round-trip, and a trusted tap loads.
          echo "== untrusted: brew info behavior =="
          if HOMEBREW_REQUIRE_TAP_TRUST=1 brew info inference-garden/ridincligun/ridincligun >/dev/null 2>&1; then
            echo "info exited 0 (warned, not refused)"
          else
            echo "info refused (non-zero)"
          fi

          # Documented user flow must work: trust, then the formula loads.
          HOMEBREW_REQUIRE_TAP_TRUST=1 brew trust inference-garden/ridincligun
          HOMEBREW_REQUIRE_TAP_TRUST=1 brew info inference-garden/ridincligun/ridincligun >/dev/null
          echo "Trusted tap loads under HOMEBREW_REQUIRE_TAP_TRUST=1."

          # Trust state round-trips.
          HOMEBREW_REQUIRE_TAP_TRUST=1 brew untrust inference-garden/ridincligun
          echo "brew trust / untrust round-trip OK."

name: From-source build

# The from-source path is the fallback for macOS/architecture combinations
# without a bottle - it must keep working. Pull requests (including the
# CI-generated bottle PRs) build it fresh; the weekly run catches upstream
# drift (new transitive deps, python bumps). There is no plain `push`
# trigger: pushes to main are covered by the pour-test workflow, and the
# bottle workflow already builds from source on five runners per release.
# Supply-chain: actions pinned to full commit SHAs.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 4" # weekly, Thursday morning UTC

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # 2026-06-05
        with:
          stable: true # latest stable brew tag, not dev-main (auto = dev-main for a tap repo)

      - name: Tap this repository at the workflow ref
        run: |
          brew tap inference-garden/ridincligun
          # setup-homebrew links the checked-out repo as the tap, making both
          # paths the same file - BSD cp fails copying a file onto itself.
          # Sync only when the contents actually differ.
          tap_formula="$(brew --repository inference-garden/ridincligun)/Formula/ridincligun.rb"
          if ! cmp -s "$GITHUB_WORKSPACE/Formula/ridincligun.rb" "$tap_formula"; then
            cp "$GITHUB_WORKSPACE/Formula/ridincligun.rb" "$tap_formula"
          fi

      - name: Install from source (builds pydantic-core / jiter via Rust)
        run: brew install --build-from-source --verbose inference-garden/ridincligun/ridincligun

      - name: Formula test (ridincligun --version)
        run: brew test --verbose inference-garden/ridincligun/ridincligun

      - name: Version smoke check
        run: ridincligun --version

      - name: Audit (strict)
        if: always()
        run: brew audit --strict --online inference-garden/ridincligun/ridincligun

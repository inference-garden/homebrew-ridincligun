name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Solo tap: build, test, and audit the formula directly on every push.
# (No PR needed; test-bot's PR-centric flow doesn't fit a single-formula tap.)
# Supply-chain note: actions are pinned to major-version tags; hardening
# option is to pin each `uses:` to a full commit SHA.

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap this repository
        run: brew tap inference-garden/ridincligun

      - name: Install from source (builds pydantic-core / jiter via Rust)
        run: brew install --build-from-source --verbose inference-garden/ridincligun/ridincligun

      - name: Formula test (ridincligun --version)
        run: brew test --verbose inference-garden/ridincligun/ridincligun

      - name: Version smoke check
        run: ridincligun --version

      - name: Audit (strict)
        if: always()
        run: brew audit --strict --online inference-garden/ridincligun/ridincligun
